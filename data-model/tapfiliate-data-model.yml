attribution_chain:
  description: >-
    The documented REST-only integration path, in order. Each step names the
    operationId that performs it.
  steps:
    - step: '1'
      entity: Click
      operation: createClick
      input: referral_code taken from the ?ref= query parameter
      output: click id, to persist in a cookie for at least the program cookie_time
    - step: '2a'
      entity: Customer
      operation: createCustomer
      input: click_id plus your own customer id
      note: SaaS / subscription / lead-gen path; enables recurring and lifetime commissions
    - step: '2b'
      entity: Conversion
      operation: createConversion
      input: click_id plus a unique external_id plus amount
      note: one-off e-commerce path
    - step: '3'
      entity: Commission
      operation: addCommissionsToConversion
      note: optional additional commissions on an existing conversion
    - step: '4'
      entity: Commission
      operation: approveCommission
      note: approval gates payout
    - step: '5'
      entity: Balance
      operation: getAffiliateBalances
      note: accrued approved commissions, per currency
    - step: '6'
      entity: Payment
      operation: createPayment
      note: settles the balance

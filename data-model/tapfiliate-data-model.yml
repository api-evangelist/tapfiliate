  - {name: Click, domain: tracking, key: id, description: A tracked visit carrying referral_code, ip, user_agent, landing_page and referrer. The attribution anchor.}
  - {name: Customer, domain: tracking, key: id, description: A tracked end customer with an external customer_id, a status, the originating Click and meta_data. Used for recurring/lifetime commissions.}
  - {name: Conversion, domain: revenue, key: id, description: A revenue event with external_id, amount, program_id, the crediting affiliate, its commissions and meta_data.}
  - {name: Commission, domain: revenue, key: id, description: An amount owed to an affiliate for a conversion, with an approved flag and a commission_type.}

docs: https://tapfiliate.com/docs/rest/
description: >-
  The entity-relationship graph behind Tapfiliate's affiliate-tracking domain.
  The spine is the attribution chain — a Click carries a referral_code and is
  claimed by an Affiliate; a Customer or a Conversion is bound to that Click by
  click_id; a Conversion generates Commissions; approved Commissions accrue to a
  Balance; a Balance is settled by a Payment. Everything else hangs off
  Affiliate or Program.
notation: >-
  relationships use has_one / has_many / belongs_to with the foreign-key or
  embedding field name; direction is from the entity that owns the reference.
id_conventions:
  note: >-
    Tapfiliate publishes no id-prefix convention (unlike Stripe's cus_/pi_).
    Affiliate ids are caller-visible strings, conversion ids are opaque, and a
    conversion is additionally addressable by the caller-supplied `external_id`,
    which the docs require to be unique per conversion. Click ids are UUID-shaped
    in the documented examples.

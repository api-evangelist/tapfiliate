  - {name: AffiliateGroup, domain: partners, key: id, description: A named grouping of affiliates used for commission structure and segmentation.}
  - {name: AffiliateProspect, domain: partners, key: id, description: A pending applicant captured by a recruitment source, promoted into an Affiliate.}
  - {name: Program, domain: programs, key: id, description: An affiliate program with currency, cookie_time, default landing page, incrementing_conversions and recurring_commissions settings.}

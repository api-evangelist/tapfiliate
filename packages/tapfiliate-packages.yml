method: searched
source: >-
  https://github.com/Tapfiliate (org repo listing via api.github.com),
  https://tapfiliate.com/docs/integrations/npm-module/,
  https://tapfiliate.com/docs/javascript/, and the public package registries
  (registry.npmjs.org, packagist.org). Version and published date read from the
  registry metadata endpoint at fetch time. Tapfiliate publishes no central
  "SDKs" page; the first-party client surface is the GitHub org plus the npm
  and Packagist entries below.
description: >-
  First-party Tapfiliate client libraries, plugins and distributions. Tapfiliate
  ships a small client surface: one npm wrapper for the browser tracking
  library, one PHP SDK on Packagist, and a handful of e-commerce plugins
  distributed only as GitHub repositories. The registry-dated evidence shows a
  decay signal: the newest first-party release in any package registry is
  2022-12-14, four years before the API version (V1.6) and the MCP server they
  currently ship.
